<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NEXUS · Quantum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   NEXUS QUANTUM — Signature Edition v6 · FINAL
   For NEXUS Team
   Features: Splash, Welcome toast, Exit confirm, 14 themes, Matrix mode,
             Formula library, Synthesized audio, History, Memory, Scientific
   ============================================================================ */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

:root{
  --bg:#000;
  --text:#fff;
  --dim:rgba(255,255,255,.45);
  --dimmer:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.06);
  --line-2:rgba(255,255,255,.1);
  --glass:rgba(255,255,255,.035);
  --glass-hi:rgba(255,255,255,.09);
  --c1:#00d4ff;
  --c2:#7c4dff;
  --c3:#ff2d95;
  --glow:rgba(0,212,255,.35);
  --glow-2:rgba(124,77,255,.22);
  --font:'Vazirmatn',system-ui,sans-serif;
  --mono:'JetBrains Mono',monospace;
  --display:'Orbitron',sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-bounce:cubic-bezier(.34,1.56,.64,1);
}

/* ---------- THEMES (14 total) ---------- */
body[data-theme="quantum"]{--c1:#00d4ff;--c2:#7c4dff;--c3:#ff2d95;--glow:rgba(0,212,255,.35);--glow-2:rgba(124,77,255,.22)}
body[data-theme="aurora"] {--c1:#00ffb3;--c2:#00b3ff;--c3:#a6ff00;--glow:rgba(0,255,179,.35);--glow-2:rgba(0,179,255,.22)}
body[data-theme="sunset"] {--c1:#ff6a3d;--c2:#ff2d95;--c3:#ffb347;--glow:rgba(255,106,61,.35);--glow-2:rgba(255,45,149,.22)}
body[data-theme="royal"]  {--c1:#ffd166;--c2:#b16bff;--c3:#ff5ebc;--glow:rgba(255,209,102,.35);--glow-2:rgba(177,107,255,.22)}
body[data-theme="ember"]  {--c1:#ffb347;--c2:#ff4769;--c3:#ff7a3d;--glow:rgba(255,179,71,.35);--glow-2:rgba(255,71,105,.22)}
body[data-theme="ice"]    {--c1:#7ff0ff;--c2:#5b9dff;--c3:#c2f5ff;--glow:rgba(127,240,255,.35);--glow-2:rgba(91,157,255,.22)}
body[data-theme="jade"]   {--c1:#3ddc84;--c2:#00b894;--c3:#a2ff80;--glow:rgba(61,220,132,.35);--glow-2:rgba(0,184,148,.22)}
body[data-theme="mono"]   {--c1:#fff;--c2:#a0a0b0;--c3:#606070;--glow:rgba(255,255,255,.25);--glow-2:rgba(160,160,176,.18)}

/* Apple-esque */
body[data-theme="apple"]{
  --bg:#f2f2f7;--text:#1c1c1e;
  --dim:rgba(60,60,67,.6);--dimmer:rgba(60,60,67,.35);
  --line:rgba(60,60,67,.12);--line-2:rgba(60,60,67,.18);
  --glass:rgba(255,255,255,.75);--glass-hi:rgba(255,255,255,.98);
  --c1:#007aff;--c2:#af52de;--c3:#ff2d55;
  --glow:rgba(0,122,255,.22);--glow-2:rgba(175,82,222,.18);
}
/* Linear */
body[data-theme="linear"]{
  --bg:#08090a;--text:#f7f8f8;
  --dim:rgba(247,248,248,.5);--dimmer:rgba(247,248,248,.28);
  --line:rgba(255,255,255,.06);--line-2:rgba(255,255,255,.1);
  --glass:rgba(255,255,255,.03);--glass-hi:rgba(255,255,255,.07);
  --c1:#5e6ad2;--c2:#8b5cf6;--c3:#a78bfa;
  --glow:rgba(94,106,210,.4);--glow-2:rgba(139,92,246,.25);
}
/* Vercel */
body[data-theme="vercel"]{
  --bg:#000;--text:#fff;
  --dim:rgba(255,255,255,.5);--dimmer:rgba(255,255,255,.28);
  --line:rgba(255,255,255,.08);--line-2:rgba(255,255,255,.14);
  --glass:rgba(255,255,255,.04);--glass-hi:rgba(255,255,255,.09);
  --c1:#fff;--c2:#888;--c3:#bbb;
  --glow:rgba(255,255,255,.18);--glow-2:rgba(255,255,255,.1);
}
/* Nord */
body[data-theme="nord"]{
  --bg:#2e3440;--text:#eceff4;
  --dim:rgba(236,239,244,.5);--dimmer:rgba(236,239,244,.3);
  --line:rgba(236,239,244,.08);--line-2:rgba(236,239,244,.14);
  --glass:rgba(236,239,244,.05);--glass-hi:rgba(236,239,244,.1);
  --c1:#88c0d0;--c2:#81a1c1;--c3:#b48ead;
  --glow:rgba(136,192,208,.35);--glow-2:rgba(129,161,193,.22);
}
/* Dracula */
body[data-theme="dracula"]{
  --bg:#191a21;--text:#f8f8f2;
  --dim:rgba(248,248,242,.5);--dimmer:rgba(248,248,242,.28);
  --line:rgba(248,248,242,.07);--line-2:rgba(248,248,242,.12);
  --glass:rgba(248,248,242,.04);--glass-hi:rgba(248,248,242,.08);
  --c1:#bd93f9;--c2:#ff79c6;--c3:#8be9fd;
  --glow:rgba(189,147,249,.4);--glow-2:rgba(255,121,198,.25);
}
/* Pearl (light) */
body[data-theme="pearl"]{
  --bg:#f5f7fb;--text:#0a1428;
  --dim:rgba(10,20,40,.55);--dimmer:rgba(10,20,40,.32);
  --line:rgba(0,20,60,.08);--line-2:rgba(0,20,60,.14);
  --glass:rgba(255,255,255,.7);--glass-hi:rgba(255,255,255,.95);
  --c1:#0066ff;--c2:#7c4dff;--c3:#ff2d95;
  --glow:rgba(0,102,255,.25);--glow-2:rgba(124,77,255,.18);
}

html,body{height:100%;width:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:var(--font);color:var(--text);background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  user-select:none;-webkit-user-select:none;position:relative;
  transition:background .5s var(--ease),color .4s;
}

/* ============================================================================
   SPLASH SCREEN
   ============================================================================ */
.splash{
  position:fixed;inset:0;z-index:9999;
  background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:26px;
  transition:opacity .55s var(--ease),visibility .55s;
  overflow:hidden;
}
.splash.hide{opacity:0;visibility:hidden;pointer-events:none}

.splash::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 45%, var(--glow), transparent 45%),
    radial-gradient(circle at 50% 55%, var(--glow-2), transparent 50%);
  animation:splashGlow 3s ease-in-out infinite alternate;
}
@keyframes splashGlow{0%{opacity:.5}100%{opacity:1}}

.splash-logo{
  position:relative;
  width:100px;height:100px;border-radius:26px;
  background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));
  box-shadow:0 0 60px var(--glow),0 0 120px var(--glow-2);
  display:flex;align-items:center;justify-content:center;
  animation:logoPop .9s var(--ease-bounce) both;
  animation-delay:.15s;
}
@keyframes logoPop{
  0%{transform:scale(0) rotate(-180deg);opacity:0}
  60%{transform:scale(1.08) rotate(10deg)}
  100%{transform:scale(1) rotate(0);opacity:1}
}
.splash-logo::before{
  content:'';position:absolute;inset:4px;border-radius:22px;
  background:var(--bg);
}
.splash-logo::after{
  content:'N';position:relative;z-index:1;
  font-family:var(--display);font-weight:900;font-size:52px;
  background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

.splash-name{
  position:relative;
  font-family:var(--display);font-weight:800;
  font-size:1.4rem;letter-spacing:8px;
  background:linear-gradient(90deg,var(--text) 40%,var(--c1));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:fadeUp .8s var(--ease) both;
  animation-delay:.5s;
}
@keyframes fadeUp{
  0%{opacity:0;transform:translateY(20px)}
  100%{opacity:1;transform:translateY(0)}
}

.splash-sub{
  position:relative;
  font-size:.72rem;font-weight:500;letter-spacing:4px;
  color:var(--dimmer);
  animation:fadeUp .8s var(--ease) both;
  animation-delay:.7s;
}

.splash-bar{
  position:relative;
  width:180px;height:3px;border-radius:3px;
  background:var(--line-2);
  overflow:hidden;
  animation:fadeUp .8s var(--ease) both;
  animation-delay:.9s;
}
.splash-bar::after{
  content:'';position:absolute;top:0;left:0;height:100%;width:40%;
  background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3));
  border-radius:3px;
  animation:barLoad 1.6s ease-in-out infinite;
  box-shadow:0 0 12px var(--glow);
}
@keyframes barLoad{
  0%{transform:translateX(-100%)}
  100%{transform:translateX(350%)}
}

/* ============================================================================
   BACKGROUND
   ============================================================================ */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
.bg::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 800px 600px at 15% 5%,var(--glow),transparent 55%),
    radial-gradient(ellipse 700px 700px at 90% 95%,var(--glow-2),transparent 55%),
    radial-gradient(ellipse 500px 400px at 55% 50%,rgba(255,45,149,.08),transparent 60%);
  animation:bgPulse 18s ease-in-out infinite alternate;
}
@keyframes bgPulse{0%{opacity:.75}100%{opacity:1}}
.bg::after{
  content:'';position:absolute;inset:0;
  background-image:
    linear-gradient(var(--line) 1px,transparent 1px),
    linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
  -webkit-mask-image:radial-gradient(ellipse at center,black 30%,transparent 75%);
  opacity:.5;
}

/* ============================================================================
   APP SHELL
   ============================================================================ */
.app{
  position:relative;z-index:10;
  width:100%;max-width:460px;height:100%;max-height:940px;
  display:flex;flex-direction:column;
  padding:20px 20px 24px;gap:20px;
  contain:layout style;
}
.app.hidden{opacity:0}
.app{animation:appIn .6s var(--ease) both}
@keyframes appIn{
  0%{opacity:0;transform:scale(.98)}
  100%{opacity:1;transform:scale(1)}
}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:0 4px;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px}
.mark{
  width:40px;height:40px;border-radius:12px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));
  box-shadow:0 0 24px var(--glow),0 4px 12px rgba(0,0,0,.4);
  flex-shrink:0;
}
.mark::before{content:'';position:absolute;inset:2px;border-radius:10px;background:var(--bg)}
.mark::after{
  content:'N';position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:900;font-size:17px;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-txt{display:flex;flex-direction:column;gap:2px;line-height:1}
.brand-name{
  font-family:var(--display);font-weight:800;font-size:.88rem;letter-spacing:3.5px;
  background:linear-gradient(90deg,var(--text) 40%,var(--c1));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.brand-sub{font-size:.58rem;font-weight:500;letter-spacing:2.4px;color:var(--dimmer)}

.tools{display:flex;gap:6px}
.tool{
  width:36px;height:36px;border-radius:12px;
  background:var(--glass);border:1px solid var(--line-2);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--dim);
  transition:color .25s,border-color .25s,transform .2s var(--ease),box-shadow .25s;
  position:relative;overflow:hidden;
}
.tool::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at center,var(--glow),transparent 70%);
  opacity:0;transition:opacity .25s;
}
.tool:hover{color:var(--c1);border-color:var(--c1)}
.tool:hover::before{opacity:.5}
.tool:active{transform:scale(.92)}
.tool svg{width:15px;height:15px;stroke-width:2;position:relative;z-index:1}
.tool.active{
  background:linear-gradient(135deg,var(--c1),var(--c2));
  color:var(--bg);border-color:transparent;
  box-shadow:0 4px 16px -2px var(--glow);
}

/* DISPLAY */
.display{
  position:relative;
  background:var(--glass);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border-radius:32px;border:1px solid var(--line-2);
  padding:22px 26px 20px;min-height:172px;
  display:flex;flex-direction:column;justify-content:space-between;
  overflow:hidden;flex-shrink:0;
  box-shadow:0 1px 0 var(--glass-hi) inset,0 20px 60px -20px rgba(0,0,0,.6);
}
.display::before{
  content:'';position:absolute;top:0;left:12%;right:12%;height:1px;
  background:linear-gradient(90deg,transparent,var(--c1),transparent);opacity:.7;
}
.display::after{
  content:'';position:absolute;bottom:0;left:25%;right:25%;height:1px;
  background:linear-gradient(90deg,transparent,var(--c2),transparent);opacity:.45;
}
.d-top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:24px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  font-family:var(--mono);font-size:.6rem;font-weight:600;
  letter-spacing:1.4px;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;
  background:rgba(255,255,255,.04);border:1px solid var(--line-2);
  color:var(--dim);display:inline-flex;align-items:center;gap:5px;
  opacity:0;transform:scale(.85);
  transition:all .35s var(--ease-bounce);cursor:pointer;white-space:nowrap;
}
.chip.on{opacity:1;transform:scale(1)}
.chip.accent{
  background:linear-gradient(135deg,var(--c1),var(--c2));
  color:var(--bg);border-color:transparent;
  box-shadow:0 2px 12px -2px var(--glow);opacity:1;transform:scale(1);
}
.chip svg{width:8px;height:8px}
.d-body{display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:8px;margin-top:14px;position:relative;z-index:1;min-height:0}
.hist{
  font-family:var(--mono);font-size:.88rem;font-weight:400;
  color:var(--dimmer);direction:ltr;text-align:right;
  min-height:1.2rem;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  letter-spacing:.4px;
}
.curr{
  font-family:var(--mono);font-size:3.2rem;font-weight:500;color:var(--text);
  direction:ltr;text-align:right;line-height:1.05;letter-spacing:-1.2px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-feature-settings:"tnum";text-shadow:0 0 60px var(--glow);
  transition:font-size .22s var(--ease);
}
.curr.md{font-size:2.5rem}
.curr.sm{font-size:1.95rem}
.curr.xs{font-size:1.5rem}
.curr.error{color:var(--c3);text-shadow:0 0 60px rgba(255,45,149,.6);animation:shake .42s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}
.curr::after{
  content:'';display:inline-block;width:2px;height:.8em;
  background:var(--c1);margin-inline-start:6px;vertical-align:middle;
  animation:blink 1.15s steps(2) infinite;
  box-shadow:0 0 12px var(--glow);border-radius:2px;opacity:.85;
}
.curr.error::after{display:none}
@keyframes blink{0%,49%{opacity:.85}50%,100%{opacity:0}}

/* MODES */
.modes{
  display:flex;gap:4px;padding:4px;
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:16px;border:1px solid var(--line-2);flex-shrink:0;
}
.mode{
  flex:1;padding:11px 8px;border:none;background:transparent;
  border-radius:12px;font-family:var(--font);font-size:.72rem;font-weight:600;
  color:var(--dim);cursor:pointer;
  transition:color .3s,background .3s,box-shadow .3s;
  display:flex;align-items:center;justify-content:center;gap:6px;
  letter-spacing:.3px;white-space:nowrap;
}
.mode svg{width:12px;height:12px}
.mode.active{
  color:var(--bg);
  background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:0 4px 18px -4px var(--glow);font-weight:700;
}
.mode:active{transform:scale(.97)}

/* GRID */
.grid{flex:1;min-height:0;position:relative;display:flex}
.pad{
  position:absolute;inset:0;display:grid;gap:10px;
  opacity:0;transform:translate3d(0,16px,0) scale(.99);
  pointer-events:none;
  transition:opacity .35s var(--ease),transform .35s var(--ease);
}
.pad.active{opacity:1;transform:translate3d(0,0,0) scale(1);pointer-events:auto}
.pad.basic{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(5,1fr)}
.pad.sci  {grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(7,1fr);gap:8px}

/* BUTTONS */
.btn{
  position:relative;border:1px solid var(--line-2);
  background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:22px;color:var(--text);
  font-family:var(--font);font-size:1.55rem;font-weight:500;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  padding:6px;overflow:hidden;
  transition:transform .08s var(--ease),background .25s,border-color .25s,color .25s,box-shadow .25s;
  outline:none;touch-action:manipulation;
  letter-spacing:.2px;user-select:none;min-height:44px;
}
.btn::before{
  content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.08) 0%,transparent 55%);opacity:.9;
}
body[data-theme="apple"] .btn::before,
body[data-theme="pearl"] .btn::before{
  background:linear-gradient(180deg,rgba(255,255,255,.9) 0%,transparent 55%);
}
.btn:hover{border-color:var(--line-2);background:var(--glass-hi)}
.btn:active,.btn.pressed{
  transform:translate3d(0,2px,0) scale(.97);
  background:var(--glass-hi);filter:brightness(1.4);
}
.btn.num{font-family:var(--mono);font-weight:500;font-size:1.65rem;letter-spacing:-.5px}
.btn.op{
  font-family:var(--mono);font-weight:600;font-size:1.75rem;color:var(--c1);
  background:linear-gradient(155deg,color-mix(in srgb,var(--c1) 10%,transparent),transparent);
  border-color:color-mix(in srgb,var(--c1) 20%,transparent);
}
.btn.op:hover{border-color:var(--c1);box-shadow:0 0 24px -6px var(--glow)}
.btn.fn{font-weight:600;font-size:1.3rem;color:var(--dim)}
.btn.fn.danger{color:var(--c3)}
.btn.fn:hover{color:var(--c1);border-color:var(--line-2)}
.btn.sci{
  font-family:var(--mono);font-weight:500;font-size:.88rem;color:var(--c2);
  background:linear-gradient(155deg,color-mix(in srgb,var(--c2) 9%,transparent),transparent);
  border-color:color-mix(in srgb,var(--c2) 18%,transparent);
  border-radius:16px;letter-spacing:0;padding:4px;
}
.btn.sci:hover{color:var(--c1);border-color:var(--c2)}
.btn.sci.tiny{font-size:.74rem}
.btn.eq{
  font-family:var(--mono);font-weight:600;font-size:1.9rem;color:var(--bg);
  background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 70%,var(--c3) 130%);
  border:none;
  box-shadow:
    0 8px 32px -8px var(--glow),
    0 0 0 1px rgba(255,255,255,.15) inset,
    0 1px 0 rgba(255,255,255,.4) inset;
  text-shadow:0 1px 2px rgba(255,255,255,.3);
  position:relative;overflow:hidden;
}
.btn.eq::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);
  transform:translateX(-100%);transition:transform .8s var(--ease);
}
.btn.eq:hover::after{transform:translateX(100%)}

/* ============================================================================
   DRAWER (shared container for History, Matrix, Formulas, About)
   ============================================================================ */
.drawer{

  overflow:hidden;
}
.drawer.open{transform:translate3d(0,0,0)}
.drawer::before{
  content:'';position:absolute;top:10px;left:50%;transform:translateX(-50%);

}
.d-head{
  display:flex;justify-content:space-between;align-items:center;
  padding-top:12px;padding-bottom:14px;

.d-title{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1rem;letter-spacing:.3px}

.dbtn{

}
.dbtn:hover{color:var(--c1);border-color:var(--c1)}
.dbtn.danger{color:var(--c3)}
.dbtn.danger:hover{border-color:var(--c3);background:rgba(255,45,149,.06)}
.dbtn.primary{
  background:linear-gradient(135deg,var(--c1),var(--c2));

}

.d-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-inline-end:6px;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--c1) transparent}
.d-body::-webkit-scrollbar{width:5px}
.d-body::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--c1),var(--c2));border-radius:4px}

.hitem{
  padding:14px 16px;border-radius:14px;
  background:rgba(255,255,255,.02);border:1px solid var(--line);
  cursor:pointer;transition:transform .2s var(--ease),border-color .2s,background .2s;
  font-family:var(--mono);direction:ltr;text-align:left;
  position:relative;overflow:hidden;
}
.hitem:hover{border-color:var(--c1);background:rgba(255,255,255,.04);transform:translateX(-3px)}
.hitem .hexpr{font-size:.76rem;color:var(--dimmer);margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .hres{font-size:1.08rem;font-weight:600;color:var(--c1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.empty-h{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;flex:1;color:var(--dimmer);font-size:.86rem}
.empty-h svg{width:52px;height:52px;opacity:.3}

/* ============================================================================
   MATRIX MODE UI
   ============================================================================ */
.mx-wrap{display:flex;flex-direction:column;gap:14px;flex:1;overflow-y:auto;padding-inline-end:4px}
.mx-section{display:flex;flex-direction:column;gap:8px}
.mx-label{font-size:.72rem;font-weight:600;color:var(--dim);letter-spacing:.5px;font-family:var(--mono)}
.mx-matrix{
  display:grid;gap:6px;
  background:rgba(255,255,255,.02);
  padding:12px;border-radius:14px;
  border:1px solid var(--line);
}
.mx-matrix.size-2{grid-template-columns:repeat(2,1fr)}
.mx-matrix.size-3{grid-template-columns:repeat(3,1fr)}
.mx-cell{
  background:var(--bg);
  border:1px solid var(--line-2);
  border-radius:10px;
  font-family:var(--mono);font-size:.9rem;
  color:var(--text);text-align:center;
  padding:10px 4px;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
  width:100%;
}
.mx-cell:focus{
  border-color:var(--c1);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 20%,transparent);
}
.mx-ops{display:flex;gap:6px;flex-wrap:wrap}
.mx-op{
  flex:1;min-width:80px;
  padding:12px 10px;border-radius:12px;
  border:1px solid var(--line-2);background:var(--glass);
  font-family:var(--mono);font-size:.85rem;font-weight:600;
  color:var(--c1);cursor:pointer;
  transition:all .2s;
}
.mx-op:hover{border-color:var(--c1);background:var(--glass-hi)}
.mx-op:active{transform:scale(.96)}
.mx-result{
  padding:16px;border-radius:14px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c1) 8%,transparent),color-mix(in srgb,var(--c2) 8%,transparent));
  border:1px solid color-mix(in srgb,var(--c1) 25%,transparent);
  font-family:var(--mono);font-size:.95rem;
  color:var(--text);text-align:center;
  min-height:56px;display:flex;align-items:center;justify-content:center;
  overflow-x:auto;
}
.mx-result.scalar{font-size:1.8rem;font-weight:700;color:var(--c1);text-shadow:0 0 20px var(--glow)}

/* ============================================================================
   FORMULA LIBRARY UI
   ============================================================================ */
.fm-list{display:flex;flex-direction:column;gap:8px;flex:1;overflow-y:auto;padding-inline-end:4px}
.fm-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 16px;border-radius:14px;
  background:rgba(255,255,255,.02);border:1px solid var(--line);
  cursor:pointer;transition:all .2s;
}
.fm-item:hover{border-color:var(--c1);background:rgba(255,255,255,.04)}
.fm-item-body{flex:1;min-width:0}
.fm-name{font-family:var(--mono);font-size:.82rem;font-weight:600;color:var(--c1);margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-expr{font-family:var(--mono);font-size:.72rem;color:var(--dimmer);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-del{
  width:32px;height:32px;border-radius:8px;
  border:1px solid var(--line-2);background:transparent;
  color:var(--c3);cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.fm-del:hover{background:rgba(255,45,149,.1);border-color:var(--c3)}

.fm-save-form{display:flex;flex-direction:column;gap:8px}
.fm-input{
  width:100%;padding:12px 14px;
  background:var(--bg);border:1px solid var(--line-2);
  border-radius:12px;color:var(--text);
  font-family:var(--mono);font-size:.85rem;
  outline:none;transition:border-color .2s,box-shadow .2s;
}
.fm-input:focus{border-color:var(--c1);box-shadow:0 0 0 3px color-mix(in srgb,var(--c1) 20%,transparent)}

/* ============================================================================
   ABOUT UI
   ============================================================================ */
.about-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;text-align:center;padding:12px 4px}
.about-logo{
  width:80px;height:80px;border-radius:22px;margin:8px auto 0;
  background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));
  box-shadow:0 0 40px var(--glow);
  position:relative;display:flex;align-items:center;justify-content:center;
}
.about-logo::before{content:'';position:absolute;inset:3px;border-radius:19px;background:var(--bg)}
.about-logo::after{
  content:'N';position:relative;z-index:1;
  font-family:var(--display);font-weight:900;font-size:38px;
  background:linear-gradient(135deg,var(--c1),var(--c2),var(--c3));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.about-title{font-family:var(--display);font-size:1.3rem;font-weight:800;letter-spacing:6px;margin-top:8px}
.about-slogan{font-size:.85rem;color:var(--dim);font-style:italic}
.about-desc{font-size:.85rem;line-height:1.7;color:var(--dim);text-align:right;padding:14px;background:rgba(255,255,255,.02);border-radius:14px;border:1px solid var(--line)}
.about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{padding:14px 8px;border-radius:12px;background:rgba(255,255,255,.02);border:1px solid var(--line)}
.stat-num{font-family:var(--mono);font-size:1.3rem;font-weight:700;color:var(--c1);text-shadow:0 0 20px var(--glow)}
.stat-lbl{font-size:.65rem;color:var(--dimmer);margin-top:4px;letter-spacing:.5px}
.about-footer{font-size:.72rem;color:var(--dimmer);margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.heart{color:var(--c3);display:inline-block;animation:beat 1.2s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* ============================================================================
   TOASTS — Welcome, Exit, Generic
   ============================================================================ */
.toast{
  position:fixed;bottom:32px;left:50%;
  transform:translate3d(-50%,140px,0);
  padding:13px 26px;border-radius:16px;
  background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--line-2);
  color:var(--text);font-size:.85rem;font-weight:600;
  box-shadow:0 12px 44px -12px rgba(0,0,0,.85),0 0 0 1px var(--glass-hi) inset;
  z-index:1000;transition:transform .45s var(--ease-bounce);
  pointer-events:none;white-space:nowrap;letter-spacing:.2px;
  display:inline-flex;align-items:center;gap:8px;
}
.toast.show{transform:translate3d(-50%,0,0)}
.toast.success{border-color:color-mix(in srgb,var(--c1) 40%,transparent);box-shadow:0 12px 44px -12px var(--glow),0 0 0 1px var(--glass-hi) inset}

/* Welcome banner — special */
.welcome{
  position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;
  transform:translate3d(-50%,-200%,0);
  padding:14px 24px;border-radius:20px;
  background:color-mix(in srgb,var(--bg) 85%,transparent);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid var(--line-2);
  box-shadow:0 20px 60px -15px rgba(0,0,0,.8),0 0 0 1px var(--glass-hi) inset,0 0 40px -10px var(--glow);
  display:flex;align-items:center;gap:12px;
  z-index:1001;pointer-events:none;
  transition:transform .7s var(--ease-bounce),opacity .5s;
  opacity:0;
}
.welcome.show{transform:translate3d(-50%,0,0);opacity:1}
.welcome-logo{
  width:36px;height:36px;border-radius:11px;
  background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));
  box-shadow:0 0 20px var(--glow);
  position:relative;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.welcome-logo::before{content:'';position:absolute;inset:2px;border-radius:9px;background:var(--bg)}
.welcome-logo::after{
  content:'N';position:relative;z-index:1;
  font-family:var(--display);font-weight:900;font-size:16px;
  background:linear-gradient(135deg,var(--c1),var(--c2));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.welcome-txt{display:flex;flex-direction:column;gap:2px;line-height:1.15}
.welcome-title{font-family:var(--display);font-weight:800;font-size:.75rem;letter-spacing:2.5px;color:var(--text)}
.welcome-msg{font-size:.72rem;font-weight:500;color:var(--dim)}

   ============================================================================ */
@media (max-width:400px){

  .splash-logo{width:88px;height:88px}

}
@media (max-width:340px){

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;

    transition-duration:.01ms !important;
  }
}

<script>
/* ============================================================================
   NEXUS QUANTUM — Engine v6 · FINAL
   ============================================================================ */
(function(){
'use strict';

/* ---------- Fast DOM cache ---------- */
const $ = function(s){ return document.querySelector(s); };
const DOM = {
  splash:$('#splash'),
  welcome:$('#welcome'), welcomeMsg:$('#welcomeMsg'),
  curr:$('#curr'), hist:$('#hist'),
  angleChip:$('#angleChip'), memChip:$('#memChip'), mxChip:$('#mxChip'),
  memBtn:$('#memBtn'), formulaBtn:$('#formulaBtn'), soundBtn:$('#soundBtn'),
  themeBtn:$('#themeBtn'), histBtn:$('#histBtn'), aboutBtn:$('#aboutBtn'),
  modes:$('#modes'),
  padBasic:$('#pad-basic'), padSci:$('#pad-sci'),
  drawer:$('#drawer'), drawerBody:$('#drawerBody'),
  drawerTitleText:$('#drawerTitleText'), drawerActions:$('#drawerActions'),
  toast:$('#toast'), toastMsg:$('#toastMsg'),
  body:document.body
};

/* ---------- State ---------- */
const S = {
  cur:'0', first:null, op:null,
  waitNext:false, justEval:false, lastAnswer:0,
  mem:0, angle:'DEG', mode:'basic',
  theme:'quantum', sound:true,
  history:[], formulas:[],
  mxSize:2
};

/* ---------- Constants ---------- */
const THEMES = ['quantum','aurora','sunset','royal','ember','ice','jade','mono','apple','linear','vercel','nord','dracula','pearl'];
const ANGLES = ['DEG','RAD','GRAD'];
const SYM = {add:'+',subtract:'−',multiply:'×',divide:'÷'};
const MAP = {add:'+',subtract:'-',multiply:'*',divide:'/'};
const LS = 'nexus_v6';
const EXIT_WINDOW = 2000;

/* ---------- Persistence ---------- */
let saveT = 0;
function save(){
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    try{
      localStorage.setItem(LS, JSON.stringify({
        h:S.history.slice(0,50), f:S.formulas,
        t:S.theme, s:S.sound, a:S.angle, m:S.mode, mem:S.mem
      }));
    }catch(_){}
  }, 500);
}
function load(){
  try{
    const r = localStorage.getItem(LS);
    if(!r) return;
    const d = JSON.parse(r);
    if(Array.isArray(d.h)) S.history = d.h;
    if(Array.isArray(d.f)) S.formulas = d.f;
    if(THEMES.indexOf(d.t) > -1) S.theme = d.t;
    if(typeof d.s === 'boolean') S.sound = d.s;
    if(ANGLES.indexOf(d.a) > -1) S.angle = d.a;
    if(d.m === 'sci' || d.m === 'basic' || d.m === 'matrix') S.mode = d.m;
    if(typeof d.mem === 'number') S.mem = d.mem;
  }catch(_){}
}

/* ============================================================================
   SYNTHESIZED AUDIO — Rich, realistic tones
   ============================================================================ */
let ctx = null;
function audio(){
  if(!ctx){
    try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(_){ ctx = null; }
  } else if(ctx.state === 'suspended'){ ctx.resume(); }
}

/* Play a rich synthesized note with envelope */
function note(freq, dur, opts){
  if(!S.sound || !ctx) return;
  opts = opts || {};
  const type = opts.type || 'sine';
  const vol = opts.vol || .05;
  const attack = opts.attack || .008;
  const detune = opts.detune || 0;
  const t = ctx.currentTime;

  // Main oscillator
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.value = freq;
  if(detune) o.detune.value = detune;

  // Slight filter for warmth
  const filter = ctx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = Math.min(freq * 6, 8000);

  // Envelope
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

  o.connect(filter); filter.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t + dur);

  // Add a subtle overtone for richness
  if(opts.rich){
    const o2 = ctx.createOscillator();
    const g2 = ctx.createGain();
    o2.type = 'triangle';
    o2.frequency.value = freq * 2;
    g2.gain.setValueAtTime(0, t);
    g2.gain.linearRampToValueAtTime(vol * 0.3, t + attack);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + dur * 0.8);
    o2.connect(g2); g2.connect(ctx.destination);
    o2.start(t); o2.stop(t + dur);
  }
}

/* Harmonic chord — for equals */
function chord(freqs, dur, vol){
  for(let i = 0; i < freqs.length; i++){
    (function(f, delay){
      setTimeout(function(){
        note(f, dur, {type:'sine', vol: vol, rich:true});
      }, delay);
    })(freqs[i], i * 40);
  }
}

/* Sound design — realistic, elegant */
const SND = {
  // Digit: subtle marimba-like tap
  digit:function(){ note(1700, .05, {type:'sine', vol:.035, rich:true}); },
  // Dot: crisp click
  dot:function(){ note(2100, .04, {type:'triangle', vol:.035}); },
  // Operator: warm bell  op:function(){ note(880, .09, {type:'sine', vol:.05, rich:true}); },
  // Equals: beautiful harmonic chord (C-E-G style)
  eq:function(){ chord([659, 831, 988], .28, .045); },
  // Clear: descending two-note
  clr:function(){
    note(660, .1, {type:'sine', vol:.05});
    setTimeout(function(){ note(440, .13, {type:'sine', vol:.045}); }, 70);
  },
  // Backspace: soft tick
  back:function(){ note(750, .04, {type:'triangle', vol:.035}); },
  // Toggle: pleasant ping
  tog:function(){ note(1320, .08, {type:'sine', vol:.04, rich:true}); },
  // Tap: soft click
  tap:function(){ note(2300, .02, {type:'sine', vol:.025}); },
  // Error: harmonic descent
  err:function(){
    note(280, .15, {type:'sine', vol:.05});
    setTimeout(function(){ note(220, .2, {type:'sine', vol:.05}); }, 80);
  },
  // Success: two-note ascent
  success:function(){
    note(880, .1, {type:'sine', vol:.045, rich:true});
    setTimeout(function(){ note(1320, .14, {type:'sine', vol:.045, rich:true}); }, 60);
  }
};

/* Vibration */
function vib(ms){
  if(navigator.vibrate){ try{ navigator.vibrate(ms || 6); }catch(_){} }
}

/* ============================================================================
   NUMBER FORMATTING
   ============================================================================ */
const RE_GRP = /\B(?=(\d{3})+(?!\d))/g;
function fmt(s){
  if(s === '' || s === '-' || s === 'خطا') return s;
  s = String(s).replace(/,/g, '');
  if(s.indexOf('e') > -1 || s.indexOf('E') > -1){
    const p = s.split(/[eE]/);
    const n = parseFloat(p[0]);
    if(!isFinite(n)) return s;
    return n.toLocaleString('en-US', {maximumFractionDigits:8}) + 'e' + p[1];
  }
  const neg = s.charAt(0) === '-';
  if(neg) s = s.slice(1);
  const d = s.indexOf('.');
  let ip, dp;
  if(d > -1){ ip = s.slice(0,d); dp = s.slice(d+1); }
  else { ip = s; dp = null; }
  if(ip === '') ip = '0';
  ip = ip.replace(RE_GRP, ',');
  return (neg ? '-' : '') + ip + (dp !== null ? '.' + dp : '');
}

/* ============================================================================
   MATH ENGINE
   ============================================================================ */
function toRad(x){
  if(S.angle === 'RAD') return x;
  if(S.angle === 'GRAD') return x * Math.PI / 200;
  return x * Math.PI / 180;
}
function fromRad(x){
  if(S.angle === 'RAD') return x;
  if(S.angle === 'GRAD') return x * 200 / Math.PI;
  return x * 180 / Math.PI;
}
function fact(n){
  if(n < 0 || !Number.isInteger(n)) return NaN;
  if(n > 170) return Infinity;
  let r = 1;
  for(let i = 2; i <= n; i++) r *= i;
  return r;
}
const FN = Object.freeze({
  sin:function(x){ return Math.sin(toRad(x)); },
  cos:function(x){ return Math.cos(toRad(x)); },
  tan:function(x){ return Math.tan(toRad(x)); },
  asin:function(x){ return fromRad(Math.asin(x)); },
  acos:function(x){ return fromRad(Math.acos(x)); },
  atan:function(x){ return fromRad(Math.atan(x)); },
  ln:function(x){ return Math.log(x); },
  log:function(x){ return Math.log10(x); },
  sqrt:function(x){ return Math.sqrt(x); },
  cbrt:function(x){ return Math.cbrt(x); },
  abs:function(x){ return Math.abs(x); },
  exp:function(x){ return Math.exp(x); },
  pow10:function(x){ return Math.pow(10,x); },
  inv:function(x){ return 1/x; },
  square:function(x){ return x*x; },
  cube:function(x){ return x*x*x; },
  fact:fact
});

function tokenize(str){
  const t = [];
  let i = 0;
  const s = str.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
  const L = s.length;
  while(i < L){
    const c = s.charCodeAt(i);
    if((c >= 48 && c <= 57) || c === 46){
      let n = '';
      while(i < L){
        const cc = s.charCodeAt(i);
        if((cc >= 48 && cc <= 57) || cc === 46){ n += s.charAt(i); i++; } else break;
      }
      if(t.length){
        const last = t[t.length - 1];
        if(last === ')' || typeof last === 'number' || (typeof last === 'string' && /^[0-9.]+$/.test(last))){
          t.push('*');
        }
      }
      t.push(n); continue;
    }
    if((c >= 65 && c <= 90) || (c >= 97 && c <= 122)){
      let name = '';
      while(i < L){
        const cc = s.charCodeAt(i);
        if((cc >= 65 && cc <= 90) || (cc >= 97 && cc <= 122)){ name += s.charAt(i); i++; } else break;
      }
      const lo = name.toLowerCase();
      if(lo === 'pi') t.push(Math.PI);
      else if(lo === 'e') t.push(Math.E);
      else t.push(lo);
      continue;
    }
    if(c === 40){
      if(t.length){
        const last = t[t.length - 1];
        if(typeof last === 'number' || last === ')' || (typeof last === 'string' && /^[0-9.]+$/.test(last))){
          t.push('*');
        }
      }
      t.push('('); i++; continue;
    }
    t.push(s.charAt(i)); i++;
  }
  return t;
}

function evalTokens(tokens){
  const P = {'+':1,'-':1,'*':2,'/':2,'^':3,'u-':4};
  const R = {'^':true,'u-':true};
  const isN = function(t){ return typeof t === 'number' || (!isNaN(parseFloat(t)) && isFinite(t)); };
  const isF = function(t){ return typeof t === 'string' && /^[a-z]+$/.test(t) && !(t in P) && t !== 'e' && t !== 'pi'; };

  const pre = [];
  const tl = tokens.length;
  for(let i = 0; i < tl; i++){
    const t = tokens[i];
    const p = pre[pre.length - 1];
    if(t === '-' && (i === 0 || p === '(' || p === '+' || p === '-' || p === '*' || p === '/' || p === '^')){
      pre.push('u-');
    } else pre.push(t);
  }

  const out = [], ops = [];
  const pl = pre.length;
  for(let i = 0; i < pl; i++){
    const t = pre[i];
    if(isN(t)) out.push(parseFloat(t));
    else if(isF(t)) ops.push(t);
    else if(t === '(') ops.push(t);
    else if(t === ')'){
      while(ops.length && ops[ops.length - 1] !== '(') out.push(ops.pop());
      if(ops.length && ops[ops.length - 1] === '(') ops.pop();
      if(ops.length && isF(ops[ops.length - 1])) out.push(ops.pop());
    } else if(t in P){
      while(ops.length && ops[ops.length - 1] !== '(' && (
        (R[t] && P[ops[ops.length - 1]] > P[t]) ||
        (!R[t] && P[ops[ops.length - 1]] >= P[t])
      )) out.push(ops.pop());
      ops.push(t);
    }
  }
  while(ops.length) out.push(ops.pop());

  const st = [];
  const ol = out.length;
  for(let i = 0; i < ol; i++){
    const t = out[i];
    if(typeof t === 'number') st.push(t);
    else if(t in FN){
      const a = st.pop();
      const r = FN[t](a);
      if(!isFinite(r)) throw new Error('m');
      st.push(r);
    } else if(t === 'u-') st.push(-st.pop());
    else {
      const b = st.pop(), a = st.pop();
      let r;
      switch(t){
        case '+': r = a + b; break;
        case '-': r = a - b; break;
        case '*': r = a * b; break;
        case '/': if(b === 0) throw new Error('d'); r = a / b; break;
        case '^': r = Math.pow(a, b); break;
        default: throw new Error('o');
      }
      if(!isFinite(r)) throw new Error('m');
      st.push(r);
    }
  }
  if(st.length !== 1) throw new Error('e');
  const r = st[0];
  if(isNaN(r)) throw new Error('n');
  return r;
}

/* ============================================================================
   MATRIX OPERATIONS
   ============================================================================ */
function matCreate(n){
  const m = [];
  for(let i = 0; i < n; i++){
    const row = [];
    for(let j = 0; j < n; j++) row.push(0);
    m.push(row);
  }
  return m;
}

function matAdd(a, b){
  const n = a.length;
  const r = matCreate(n);
  for(let i = 0; i < n; i++)
    for(let j = 0; j < n; j++)
      r[i][j] = a[i][j] + b[i][j];
  return r;
}

function matSub(a, b){
  const n = a.length;
  const r = matCreate(n);
  for(let i = 0; i < n; i++)
    for(let j = 0; j < n; j++)
      r[i][j] = a[i][j] - b[i][j];
  return r;
}

function matMul(a, b){
  const n = a.length;
  const r = matCreate(n);
  for(let i = 0; i < n; i++)
    for(let j = 0; j < n; j++){
      let s = 0;
      for(let k = 0; k < n; k++) s += a[i][k] * b[k][j];
      r[i][j] = s;
    }
  return r;
}

function matDet(m){
  const n = m.length;
  if(n === 1) return m[0][0];
  if(n === 2) return m[0][0]*m[1][1] - m[0][1]*m[1][0];
  // 3x3
  return m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])
       - m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])
       + m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);
}

function matTranspose(m){
  const n = m.length;
  const r = matCreate(n);
  for(let i = 0; i < n; i++)
    for(let j = 0; j < n; j++)
      r[i][j] = m[j][i];
  return r;
}

function matInverse(m){
  const n = m.length;
  const d = matDet(m);
  if(Math.abs(d) < 1e-12) return null;
  if(n === 2){
    return [
      [ m[1][1]/d, -m[0][1]/d],
      [-m[1][0]/d,  m[0][0]/d]
    ];
  }
  if(n === 3){
    const r = matCreate(3);
    r[0][0] =  (m[1][1]*m[2][2]-m[1][2]*m[2][1])/d;
    r[0][1] = -(m[0][1]*m[2][2]-m[0][2]*m[2][1])/d;
    r[0][2] =  (m[0][1]*m[1][2]-m[0][2]*m[1][1])/d;
    r[1][0] = -(m[1][0]*m[2][2]-m[1][2]*m[2][0])/d;
    r[1][1] =  (m[0][0]*m[2][2]-m[0][2]*m[2][0])/d;
    r[1][2] = -(m[0][0]*m[1][2]-m[0][2]*m[1][0])/d;
    r[2][0] =  (m[1][0]*m[2][1]-m[1][1]*m[2][0])/d;
    r[2][1] = -(m[0][0]*m[2][1]-m[0][1]*m[2][0])/d;
    r[2][2] =  (m[0][0]*m[1][1]-m[0][1]*m[1][0])/d;
    return r;
  }
  return null;
}

function matRound(m){
  const n = m.length;
  for(let i = 0; i < n; i++)
    for(let j = 0; j < n; j++)
      m[i][j] = parseFloat(m[i][j].toPrecision(10));
  return m;
}

/* ============================================================================
   DISPLAY — RAF batched
   ============================================================================ */
let rafPend = false, lastTxt = '', lastCls = '';
function sched(){
  if(rafPend) return;
  rafPend = true;
  requestAnimationFrame(paint);
}
function paint(){
  rafPend = false;
  const txt = S.cur === 'خطا' ? 'خطا' : fmt(S.cur);
  if(txt !== lastTxt){
    DOM.curr.textContent = txt;
    lastTxt = txt;
    const L = txt.length;
    let cls = '';
    if(L > 20) cls = 'xs';
    else if(L > 14) cls = 'sm';
    else if(L > 10) cls = 'md';
    const err = S.cur === 'خطا' ? 'error ' : '';
    const full = err + cls;
    if(full !== lastCls){
      DOM.curr.className = 'curr' + (full ? ' ' + full : '');
      lastCls = full;
    }
  }
  let h = '';
  if(S.first !== null && S.op) h = fmt(String(S.first)) + ' ' + SYM[S.op];
  if(DOM.hist.textContent !== h) DOM.hist.textContent = h;
  const memOn = S.mem !== 0;
  if(DOM.memChip.classList.contains('on') !== memOn){
    DOM.memChip.classList.toggle('on', memOn);
    DOM.memBtn.classList.toggle('active', memOn);
  }
}

/* ============================================================================
   ACTIONS
   ============================================================================ */
function err(){
  S.cur = 'خطا'; S.first = null; S.op = null;
  S.waitNext = false; S.justEval = false;
  sched(); SND.err(); vib([25,40,25]);
}
function reset(){
  S.cur = '0'; S.first = null; S.op = null;
  S.waitNext = false; S.justEval = false;
  DOM.hist.textContent = '';
  sched();
}
function digit(d){
  if(S.justEval){
    S.cur = d === '.' ? '0.' : d;
    S.justEval = false; S.first = null; S.op = null; S.waitNext = false;
    sched(); return;
  }
  if(S.waitNext){
    S.cur = d === '.' ? '0.' : d; S.waitNext = false;
  } else if(S.cur === '0' && d !== '.') S.cur = d;
  else if(S.cur === '-0' && d !== '.') S.cur = '-' + d;
  else if(d === '.' && S.cur.indexOf('.') > -1){
    const last = S.cur.split(/[+\-×÷*/()^]/).pop();
    if(last && last.indexOf('.') > -1) return;
    S.cur += '.';
  } else {
    if(S.cur.replace(/[^0-9]/g, '').length >= 16) return;
    S.cur += d;
  }
  sched();
}
function op(o){
  try{
    if(S.justEval){
      S.first = S.lastAnswer; S.cur = String(S.lastAnswer); S.justEval = false;
    } else if(S.op && !S.waitNext && S.first !== null){
      const v = evalTokens(tokenize(S.cur));
      S.first = v; S.cur = String(v);
    } else if(S.op === null || S.waitNext){
      const v = evalTokens(tokenize(S.cur));
      S.first = v; S.cur = String(v);
    }
  } catch(_){ err(); return; }
  S.op = MAP[o]; S.waitNext = true; S.justEval = false;
  S.cur = String(S.first);
  DOM.hist.textContent = fmt(String(S.first)) + ' ' + SYM[o];
  sched(); SND.op();
}
function equals(){
  if(S.cur === 'خطا'){ reset(); return; }
  try{
    let f = S.cur;
    if(S.op !== null && S.first !== null) f = S.first + S.op + S.cur;
    const r = evalTokens(tokenize(f));
    const shown = parseFloat(r.toPrecision(12));
    const pretty = String(f).replace(/\*/g,'×').replace(/\//g,'÷');
    pushHist(pretty, String(shown));
    S.lastAnswer = shown;
    S.cur = String(shown);
    S.first = null; S.op = null; S.waitNext = false; S.justEval = true;
    DOM.hist.textContent = pretty + ' =';
    sched(); SND.eq(); vib(14);
  } catch(_){ err(); }
}
function pct(){
  try{
    const v = evalTokens(tokenize(S.cur));
    S.cur = String(v / 100); S.justEval = false;
    sched(); SND.tap();
  } catch(_){ err(); }
}
function sign(){
  if(S.cur === '0' || S.cur === 'خطا') return;
  S.cur = S.cur.charAt(0) === '-' ? S.cur.slice(1) : '-' + S.cur;
  sched(); SND.tap();
}
function bksp(){
  if(S.cur === 'خطا' || S.justEval){ reset(); return; }
  if(S.waitNext) return;
  if(S.cur.length <= 1) S.cur = '0';
  else S.cur = S.cur.slice(0, -1);
  if(S.cur === '' || S.cur === '-') S.cur = '0';
  sched(); SND.back();
}
function unary(fn){
  try{
    const v = evalTokens(tokenize(S.cur));
    const r = FN[fn] ? FN[fn](v) : NaN;
    if(!isFinite(r) || isNaN(r)) throw new Error('m');
    S.cur = parseFloat(r.toPrecision(12)).toString();
    S.justEval = false;
    sched(); SND.op();
  } catch(_){ err(); }
}
function append(t){
  if(S.justEval){ S.cur = '0'; S.justEval = false; }
  if(S.waitNext){ S.cur = ''; S.waitNext = false; }
  S.cur += t;
  sched(); SND.tap();
}
function memAct(k){
  try{
    if(k === 'mc'){ S.mem = 0; toast('حافظه پاک شد', 'warn'); }
    else if(k === 'mr'){ S.cur = String(S.mem); S.justEval = false; }
    else if(k === 'mplus'){ S.mem += evalTokens(tokenize(S.cur)); toast('به حافظه اضافه شد'); }
    else if(k === 'mminus'){ S.mem -= evalTokens(tokenize(S.cur)); toast('از حافظه کم شد'); }
    save(); sched(); SND.tog();
  } catch(_){ err(); }
}

/* ============================================================================

   ============================================================================ */
function pushHist(e, r){
  S.history.unshift({ e:e, r:r, t:Date.now() });
  if(S.history.length > 50) S.history.length = 50;
  save();
}
function saveFormula(){
  const expr = S.cur;
  if(!expr || expr === '0' || expr === 'خطا'){
    toast('چیزی برای ذخیره نیست', 'warn');
    return;
  }
  openDrawer('formula');
  // Pre-fill with current expression
  const listEl = DOM.drawerBody;
  const inputName = listEl.querySelector('#fmName');
  const inputExpr = listEl.querySelector('#fmExpr');
  if(inputExpr) inputExpr.value = expr;
  if(inputName) inputName.focus();
}
function addFormula(name, expr){
  if(!name.trim() || !expr.trim()){ toast('نام و فرمول را وارد کنید', 'warn'); return; }
  S.formulas.unshift({ n:name.trim(), e:expr.trim(), t:Date.now() });
  save();
  toast('فرمول ذخیره شد', 'success');
  SND.success();
  openDrawer('formula');
}
function deleteFormula(i){
  S.formulas.splice(i, 1);
  save();
  toast('فرمول حذف شد', 'warn');
  openDrawer('formula');
}
function useFormula(i){
  const f = S.formulas[i];
  if(!f) return;
  S.cur = f.e;
  S.justEval = false;
  S.waitNext = false;
  sched();
  closeDrawer();
  SND.tap();
  toast('فرمول بارگذاری شد', 'success');
}

  parts.push('</div></div>');

  // Matrix A
  parts.push('<div class="mx-section"><div class="mx-label">ماتریس A</div>');
  parts.push('<div class="mx-matrix size-' + n + '">');
  for(let i = 0; i < n; i++)
    for(let j = 0; j < n; j++)
      parts.push('<input type="text" class="mx-cell" data-mat="a" data-i="' + i + '" data-j="' + j + '" inputmode="decimal" value="0">');
  parts.push('</div></div>');

  // Matrix B
  parts.push('<div class="mx-section"><div class="mx-label">ماتریس B</div>');
  parts.push('<div class="mx-matrix size-' + n + '">');
  for(let i = 0; i < n; i++)
    for(let j = 0; j < n; j++)
      parts.push('<input type="text" class="mx-cell" data-mat="b" data-i="' + i + '" data-j="' + j + '" inputmode="decimal" value="0">');
  parts.push('</div></div>');

  // Operations
  parts.push('<div class="mx-section"><div class="mx-label">عملیات</div><div class="mx-ops">');
  parts.push('<button class="mx-op" data-op="add">A + B</button>');
  parts.push('<button class="mx-op" data-op="sub">A − B</button>');
  parts.push('<button class="mx-op" data-op="mul">A × B</button>');
  parts.push('<button class="mx-op" data-op="det">det(A)</button>');
  parts.push('<button class="mx-op" data-op="inv">A⁻¹</button>');
  parts.push('<button class="mx-op" data-op="trans">Aᵀ</button>');
  parts.push('</div></div>');

  // Result
  parts.push('<div class="mx-section"><div class="mx-label">نتیجه</div>');
  parts.push('<div class="mx-result" id="mxResult">—</div></div>');

  parts.push('</div>');

  DOM.drawerBody.innerHTML = parts.join('');

  // Bind size buttons
  DOM.drawerBody.querySelectorAll('[data-size]').forEach(function(b){
    b.onclick = function(){
      S.mxSize = +b.dataset.size;
      renderMatrix();
    };

  // Bind op buttons
  DOM.drawerBody.querySelectorAll('[data-op]').forEach(function(b){
    b.onclick = function(){ doMatrixOp(b.dataset.op); };
  });

function readMatrix(side){
  const n = S.mxSize;
  const m = matCreate(n);
  let hasError = false;
  for(let i = 0; i < n; i++){
    for(let j = 0; j < n; j++){
      const inp = DOM.drawerBody.querySelector('input[data-mat="' + side + '"][data-i="' + i + '"][data-j="' + j + '"]');
      const v = parseFloat(inp.value);
      if(isNaN(v)){ hasError = true; }
      m[i][j] = isNaN(v) ? 0 : v;
    }
  }
  if(hasError) toast('مقادیر نامعتبر', 'warn');
  return m;
}

function matrixToHtml(m){
  if(typeof m === 'number'){
    return '<div class="mx-result scalar">' + fmt(String(parseFloat(m.toPrecision(10)))) + '</div>';
  }
  const n = m.length;
  let s = '<div class="mx-result" style="flex-direction:column;align-items:stretch;gap:4px;padding:10px">';
  s += '<table style="width:100%;border-collapse:separate;border-spacing:6px 2px;font-family:var(--mono);font-size:.9rem">';
  for(let i = 0; i < n; i++){
    s += '<tr>';
    for(let j = 0; j < n; j++){
      s += '<td style="text-align:center;padding:6px 4px;color:var(--c1);font-weight:600">' + fmt(String(parseFloat(m[i][j].toPrecision(8)))) + '</td>';
    }
    s += '</tr>';
  }
  s += '</table></div>';
  return s;
}

function doMatrixOp(op){
  const a = readMatrix('a');
  const b = readMatrix('b');
  let result, isScalar = false;

  try{
    if(op === 'add') result = matRound(matAdd(a, b));
    else if(op === 'sub') result = matRound(matSub(a, b));
    else if(op === 'mul') result = matRound(matMul(a, b));
    else if(op === 'det'){ result = parseFloat(matDet(a).toPrecision(10)); isScalar = true; }
    else if(op === 'inv'){
      const r = matInverse(a);
      if(!r){ toast('ماتریس معکوس‌پذیر نیست', 'warn'); SND.err(); return; }
      result = matRound(r);
    }
    else if(op === 'trans') result = matRound(matTranspose(a));
    else return;
  } catch(_){ toast('خطا در محاسبه', 'warn'); SND.err(); return; }

  const resultEl = DOM.drawerBody.querySelector('#mxResult');
  if(resultEl){
    if(isScalar){
      resultEl.className = 'mx-result scalar';
      resultEl.textContent = fmt(String(result));
    } else {
      resultEl.outerHTML = matrixToHtml(result);
    }
  }
  SND.success(); vib(10);
}

/* ============================================================================
   ESCAPE HELPER
   ============================================================================ */
const ESC_MAP = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const ESC_RE = /[&<>"']/g;
function esc(s){ return String(s).replace(ESC_RE, function(c){ return ESC_MAP[c]; }); }

/* ============================================================================
   DISPATCH
   ============================================================================ */
function act(a){
  switch(a){
    case 'clear': reset(); SND.clr(); break;
    case 'backspace': bksp(); break;
    case 'percent': pct(); break;
    case 'decimal': digit('.'); SND.dot(); break;
    case 'sign': sign(); break;
    case 'equals': equals(); break;
    case 'add': case 'subtract': case 'multiply': case 'divide': op(a); break;
    case 'open-paren': append('('); break;
    case 'close-paren': append(')'); break;
    case 'pi': append('π'); break;
    case 'e': append('e'); break;
    case 'power': append('^'); break;
    case 'sin': case 'cos': case 'tan':
    case 'asin': case 'acos': case 'atan':
    case 'ln': case 'log': case 'sqrt': case 'cbrt':
    case 'abs': case 'exp': case 'pow10': case 'inv':
    case 'square': case 'cube': case 'fact':
      unary(a); break;
    case 'mc': case 'mplus': case 'mminus': case 'mr':
      memAct(a); break;
    case 'rand':
      S.cur = String(parseFloat(Math.random().toPrecision(8)));
      S.justEval = false; sched(); SND.tap(); break;
    case 'ans':
      S.cur = String(S.lastAnswer); S.justEval = false; sched(); SND.tap(); break;
    case 'saveFormula': saveFormula(); break;
  }
}

document.addEventListener('pointerdown', function(ev){
  audio();
  const btn = ev.target.closest('.btn');
  if(!btn) return;
  const r = btn.getBoundingClientRect();
  const sz = r.width > r.height ? r.width : r.height;
  const rip = document.createElement('span');
  rip.className = 'rip';
  rip.style.width = rip.style.height = sz + 'px';
  rip.style.left = (ev.clientX - r.left - sz/2) + 'px';
  rip.style.top = (ev.clientY - r.top - sz/2) + 'px';
  btn.appendChild(rip);
  setTimeout(function(){ if(rip.parentNode) rip.parentNode.removeChild(rip); }, 700);
  btn.classList.add('pressed');
  setTimeout(function(){ btn.classList.remove('pressed'); }, 90);
  const n = btn.dataset.number;
  const a = btn.dataset.action;
  if(n != null){ digit(n); SND.digit(); }
  else if(a){ act(a); }
  vib(5);
}, {passive:true});

/* Keyboard */
const KM = {
  '0':'n:0','1':'n:1','2':'n:2','3':'n:3','4':'n:4',
  '5':'n:5','6':'n:6','7':'n:7','8':'n:8','9':'n:9',
  '.':'a:decimal', ',':'a:decimal',
  '+':'a:add','-':'a:subtract',
  '*':'a:multiply','x':'a:multiply','X':'a:multiply',
  '/':'a:divide','%':'a:percent',
  '=':'a:equals','Enter':'a:equals',
  'Backspace':'a:backspace',
  'Escape':'a:clear','Delete':'a:clear',
  '(':'a:open-paren',')':'a:close-paren','^':'a:power'
};
document.addEventListener('keydown', function(e){
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.target.matches('input,textarea')) return;
  const m = KM[e.key];
  if(!m) return;
  e.preventDefault(); audio();
  const k = m.charAt(0), v = m.slice(2);
  if(k === 'n') digit(v);
  else act(v);
  const sel = k === 'n' ? '.btn[data-number="'+v+'"]' : '.btn[data-action="'+v+'"]';
  const b = document.querySelector(sel);
  if(b){ b.classList.add('pressed'); setTimeout(function(){ b.classList.remove('pressed'); }, 100); }
  vib(4);
});

/* Angle */
DOM.angleChip.addEventListener('click', function(){
  const i = ANGLES.indexOf(S.angle);
  S.angle = ANGLES[(i + 1) % ANGLES.length];
  DOM.angleChip.textContent = S.angle;
  toast('زاویه: ' + S.angle);
  SND.tog(); vib(6); save();
});

/* Theme */
DOM.themeBtn.addEventListener('click', function(){
  const i = THEMES.indexOf(S.theme);
  S.theme = THEMES[(i + 1) % THEMES.length];
  DOM.body.setAttribute('data-theme', S.theme);
  toast('تم: ' + S.theme.toUpperCase());
  SND.tog(); vib(6); save();
});

/* Sound */
DOM.soundBtn.addEventListener('click', function(){
  S.sound = !S.sound;
  DOM.soundBtn.classList.toggle('active', S.sound);
  if(S.sound){ audio(); SND.success(); }
  vib(6); save();
});

/* Memory quick */
DOM.memBtn.addEventListener('click', function(){
  toast('حافظه: ' + (S.mem ? fmt(String(S.mem)) : 'خالی'), 'warn');
  SND.tap();
});

/* Formula button */
DOM.formulaBtn.addEventListener('click', function(){ openDrawer('formula'); });

/* History button */
DOM.histBtn.addEventListener('click', function(){ openDrawer('history'); });

/* About button */
DOM.aboutBtn.addEventListener('click', function(){ openDrawer('about'); });

/* ============================================================================
   EXIT CONFIRMATION (Back button)
   ============================================================================ */
let exitArmed = false;
let exitTimer = 0;
function armExit(){
  exitArmed = true;
  toast('برای خروج دوباره بزنید', 'warn');
  SND.tog();
  vib(20);
  clearTimeout(exitTimer);
  exitTimer = setTimeout(function(){ exitArmed = false; }, EXIT_WINDOW);
}

// Push a dummy state so back button triggers popstate
if(window.history && window.history.pushState){
  history.pushState({ nexus:true }, '', location.href);
  window.addEventListener('popstate', function(e){
    if(exitArmed){
      // Allow exit
      return;
    }
    // Prevent exit — re-push state and arm
    history.pushState({ nexus:true }, '', location.href);
    armExit();
  });
}

/* ============================================================================
   INIT
   ============================================================================ */
load();
DOM.body.setAttribute('data-theme', S.theme);
DOM.angleChip.textContent = S.angle;
if(S.mode === 'sci'){
  DOM.padBasic.classList.remove('active');
  DOM.padSci.classList.add('active');
  const k = DOM.modes.children;
  for(let i = 0; i < k.length; i++) k[i].classList.toggle('active', k[i].dataset.mode === 'sci');
}
DOM.soundBtn.classList.toggle('active', S.sound);
sched();

/* Splash → Welcome → App */
setTimeout(function(){
  DOM.splash.classList.add('hide');
  audio();
  SND.success();
  setTimeout(welcomeToast, 350);
}, 1900);

/* One-time guards */
document.addEventListener('dblclick', function(e){ if(e.target.closest('.btn')) e.preventDefault(); }, {passive:false});
document.addEventListener('selectstart', function(e){ if(e.target.closest('.btn')) e.preventDefault(); });
document.addEventListener('contextmenu', function(e){ if(e.target.closest('.app')) e.preventDefault(); });
document.addEventListener('touchstart', function(){ audio(); }, {once:true, passive:true});
document.addEventListener('click', function(){ audio(); }, {once:true});
document.addEventListener('visibilitychange', function(){
  if(document.hidden){
    try{
      localStorage.setItem(LS, JSON.stringify({
        h:S.history.slice(0,50), f:S.formulas, t:S.theme, s:S.sound,
        a:S.angle, m:S.mode, mem:S.mem
      }));
    }catch(_){}
  }
});

})();
</script>
</body>
